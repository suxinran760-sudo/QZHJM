name: Build APK from ZIP

# 手机上传 zip 用这个版本：先找到你传上来的 zip 解压，再编译 APK
# 把 hajimi-github-apk.zip 传到仓库里（根目录最好，放文件夹里也能找到）
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip uploaded project
        run: |
          ls -la
          ZIP=$(find . -maxdepth 3 -name "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then echo "仓库里没有找到 zip 文件，请先把 hajimi-github-apk.zip 传到仓库里再跑"; exit 1; fi
          echo "找到 zip：$ZIP"
          unzip -q "$ZIP" -d app
          ls app

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: cd app && npm ci

      - name: Sync web assets to Android
        run: cd app && npx cap sync android

      - name: Build debug APK
        run: |
          cd app
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hajimi-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
